services:
  - type: web
    name: mac-nation
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: BOOKING_SMS_TO
        sync: false
      - key: WHATSAPP_FROM
        sync: false
      - key: WHATSAPP_CONTENT_SID
        sync: false
      - key: BOOKING_EMAIL_TO
        sync: false
